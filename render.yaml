# Despliegue en Render (plan gratis): render.com > New > Blueprint > elige este repositorio.
# Crea dos servicios: la web (React) y el servidor Python (pagos y certificados).
services:
  - type: web
    name: nova-course-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: SUPABASE_URL
        value: https://dahcovctbafmrtshpczo.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_tsNQIpXnxN8-xqkzv9vtXw_AiEz3Zfs
      - key: DATABASE_URL
        sync: false # Render te la pedirá (es privada)
      - key: FRONTEND_URL
        value: https://nova-course.onrender.com
      - key: CORS_ORIGINS
        value: https://nova-course.onrender.com
      - key: PAYMENTS_DEMO_MODE
        value: "true"
      - key: WOMPI_PUBLIC_KEY
        sync: false
      - key: WOMPI_INTEGRITY_SECRET
        sync: false
      - key: WOMPI_EVENTS_SECRET
        sync: false
      - key: WOMPI_API_URL
        value: https://sandbox.wompi.co/v1

  - type: web
    name: nova-course
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        value: https://dahcovctbafmrtshpczo.supabase.co
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_tsNQIpXnxN8-xqkzv9vtXw_AiEz3Zfs
      - key: VITE_API_URL
        value: https://nova-course-api.onrender.com
